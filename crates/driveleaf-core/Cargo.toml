[package]
name = "driveleaf-core"
description = "Disk usage model, aggregation and directory-walk scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["disk-usage", "du", "filesystem", "ntfs", "treemap"]
categories = ["filesystem"]

[lints]
workspace = true

[dependencies]
driveleaf-ntfs.workspace = true
driveleaf-treemap.workspace = true
rayon.workspace = true

[dev-dependencies]
driveleaf-ntfs = { workspace = true, features = ["synth"] }
flate2 = "1"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
driveleaf-win.workspace = true
