License: MIT OR Apache-2.0
LicenseUrl: https://github.com/{{REPOSITORY}}/blob/main/LICENSE-MIT
ShortDescription: Fast, open-source disk space analyzer that reads the NTFS Master File Table.
Description: |-
  Driveleaf shows what fills your disk. With administrator rights it reads the NTFS
  Master File Table directly, so a full drive scans in moments; without them it walks
  the folders in parallel. Drives appear as a folder tree and a treemap you can click
  through, with the largest files, space per file type and search. It makes no
  network connections.
