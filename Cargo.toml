[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "spikes/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["The Driveleaf Authors"]

[workspace.dependencies]
driveleaf-core = { path = "crates/driveleaf-core" }
driveleaf-ntfs = { path = "crates/driveleaf-ntfs" }
driveleaf-treemap = { path = "crates/driveleaf-treemap" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Keep the UI binary small; the scan engine stays optimized for speed.
[profile.release.package.driveleaf-desktop]
opt-level = "s"
